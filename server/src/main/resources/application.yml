server:
  port: 8788
  error:
    include-message: always

spring:
  config:
    import: optional:file:.env.local[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      # This service uses an external MySQL database. Spring otherwise skips
      # schema.sql, leaving recording completion without its session table.
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

whiteboard:
  trtc:
    sdk-app-id: ${TRTC_SDK_APP_ID}
    secret-key: ${TRTC_SECRET_KEY:}
    user-sig-expire-seconds: ${TRTC_USER_SIG_TTL_SECONDS:7200}
  storage-root: ./data/storage/whiteboard
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    upload-url: ${QINIU_UPLOAD_URL:https://up-z1.qiniup.com}
    public-domain: ${QINIU_PUBLIC_DOMAIN:}
    token-expire-seconds: ${QINIU_TOKEN_EXPIRE_SECONDS:3600}

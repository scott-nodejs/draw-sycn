server:
  port: ${TEACHER_AGENT_PORT:8791}
  error:
    include-message: always

teacher-agent:
  planner:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:90}
  execution:
    speech-chars-per-second: ${SPEECH_CHARS_PER_SECOND:5.0}
    minimum-speech-millis: ${MINIMUM_SPEECH_MILLIS:1200}
    action-gap-millis: ${ACTION_GAP_MILLIS:250}
